name: Build and Deploy Documentation

on:
  # Trigger on pushes to main branch
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'src/pyfds/**'
      - '.github/workflows/docs.yml'

  # Trigger on pull requests that change documentation
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'src/pyfds/**'
      - '.github/workflows/docs.yml'

  # Allow manual trigger
  workflow_dispatch:

# Avoid overlapping deploys of the same ref
concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build documentation (also validates the build on pull requests)
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git-based page dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra docs

      - name: Build documentation
        run: |
          uv run zensical build --strict

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./site
          retention-days: 1

  # Deploy to Cloudflare Pages (only on push to main)
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: docs-site
          path: ./site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pyfds-docs --branch=main
